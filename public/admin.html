<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | WA Mini League</title>
<link href="https://fonts.cdnfonts.com/css/perfect-dos-vga-437" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="/">
      <span class="brand-mark">Æ</span>
      <span class="brand-name">WA Mini League</span>
    </a>
  </div>
</header>

<div class="wrap">
  <header class="tool-header">
    <h1>Admin</h1>
    <p>Edit or delete submitted games. Changes take effect immediately on standings.</p>
  </header>
  <nav class="tab-bar">
    <a href="/">Submit</a>
    <a href="/standings.html">Standings</a>
    <a href="/admin.html" class="active">Admin</a>
  </nav>

  <div id="loginBox" class="admin-login">
    <p class="hint">Enter the admin password to continue.</p>
    <input type="password" id="pw" placeholder="Admin password">
    <button class="opt primary" id="loginBtn" style="width:100%">Unlock</button>
    <div id="loginErr"></div>
  </div>

  <div id="sortRow" class="filter-row" hidden>
    <div class="filter-btns">
      <button class="opt small sort-btn" data-sort="added" aria-pressed="true">Date added</button>
      <button class="opt small sort-btn" data-sort="played" aria-pressed="false">Date played</button>
    </div>
  </div>
  <main id="panel" hidden></main>
</div>

<script type="module">
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

const loginBox = document.getElementById('loginBox');
const panel = document.getElementById('panel');
const pwInput = document.getElementById('pw');
const sortRow = document.getElementById('sortRow');

let allGames = [];
let sortMode = 'added'; // 'added' | 'played'

function getPw() { return sessionStorage.getItem('wa_admin_pw') || ''; }
function setPw(v) { sessionStorage.setItem('wa_admin_pw', v); }

async function tryUnlock(pw) {
  const res = await fetch('/api/admin/verify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw })
  });
  if (!res.ok) return false;
  setPw(pw);
  loginBox.hidden = true;
  panel.hidden = false;
  sortRow.hidden = false;
  loadPanel();
  return true;
}

document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    sortMode = btn.dataset.sort;
    document.querySelectorAll('.sort-btn').forEach(b => b.setAttribute('aria-pressed', 'false'));
    btn.setAttribute('aria-pressed', 'true');
    renderPanel();
  });
});

document.getElementById('loginBtn').addEventListener('click', async () => {
  const ok = await tryUnlock(pwInput.value);
  if (!ok) document.getElementById('loginErr').innerHTML = `<div class="err">Wrong password.</div>`;
});
pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('loginBtn').click(); });

// If a password is already stored in this browser tab's session, try it silently.
if (getPw()) tryUnlock(getPw());

async function loadPanel() {
  allGames = await fetch('/api/games').then(r => r.json());
  renderPanel();
}

function renderPanel() {
  if (!allGames.length) { panel.innerHTML = `<div class="hint">No games submitted yet.</div>`; return; }

  // Unresolved games (WADB couldn't determine a winner) need attention —
  // surface them first regardless of sort mode. Within each group, sort by
  // either upload time (default — surfaces what just came in, even if it's
  // a replay of an old match) or the in-game date, submitter's choice.
  const sorted = [...allGames].sort((a, b) => {
    const unresolvedDiff = (a.outcomeStatus === 'unresolved' ? 0 : 1) - (b.outcomeStatus === 'unresolved' ? 0 : 1);
    if (unresolvedDiff !== 0) return unresolvedDiff;
    const aDate = sortMode === 'played' ? (a.playedAt || a.submittedAt) : a.submittedAt;
    const bDate = sortMode === 'played' ? (b.playedAt || b.submittedAt) : b.submittedAt;
    return new Date(bDate) - new Date(aDate);
  });

  panel.innerHTML = sorted.map(g => `
    <div class="gamecard" data-id="${g.id}">
      <div class="top">
        <span class="players name-raw">${g.players.map(p => esc(p.playerName)).join(' vs ')}</span>
        <span class="meta">
          ${g.outcomeStatus === 'unresolved' ? '<span class="unresolved-tag">Needs review</span> &middot; ' : ''}
          added ${g.submittedAt ? new Date(g.submittedAt).toISOString().slice(0,10) : 'unknown'}
          &middot; played ${g.playedAt ? new Date(g.playedAt).toISOString().slice(0,10) : 'unknown'}
          ${g.winnerSource ? ` &middot; ${g.winnerSource === 'wadb' ? 'verified via WADB' : 'set manually'}` : ''}
        </span>
      </div>
      <div class="row" style="margin-top:10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <select class="winner-select name-raw">
          <option value="" ${g.outcomeStatus === 'unresolved' ? 'selected' : ''} disabled>-- choose winner --</option>
          ${g.players.map(p => `<option value="${p.playerId}" ${!g.isDraw && p.playerId === g.winnerPlayerId ? 'selected' : ''}>${esc(p.playerName)}</option>`).join('')}
          <option value="draw" ${g.isDraw ? 'selected' : ''}>Draw</option>
        </select>
        <button class="opt save-btn">Save</button>
        <button class="opt danger delete-btn">Delete</button>
        ${g.wadbUrl ? `<a href="${g.wadbUrl}" target="_blank" rel="noopener">WADB &#8599;</a>` : ''}
        <a href="${g.replayDownloadUrl}" style="margin-left:auto;">download replay</a>
      </div>
      <div class="save-msg"></div>
    </div>
  `).join('');

  panel.querySelectorAll('.gamecard').forEach(card => {
    const id = Number(card.dataset.id);
    card.querySelector('.save-btn').addEventListener('click', async () => {
      const sel = card.querySelector('.winner-select');
      const msg = card.querySelector('.save-msg');
      const isDraw = sel.value === 'draw';
      const winnerPlayerId = isDraw ? null : Number(sel.value);
      const res = await fetch(`/api/admin/games/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Password': getPw() },
        body: JSON.stringify({ isDraw, winnerPlayerId })
      });
      const data = await res.json();
      if (res.ok) {
        msg.innerHTML = `<div class="ok">Saved.</div>`;
        const g = allGames.find(x => x.id === id);
        if (g) {
          g.isDraw = isDraw;
          g.winnerPlayerId = winnerPlayerId;
          g.winnerName = g.players.find(p => p.playerId === winnerPlayerId)?.playerName || null;
          g.outcomeStatus = isDraw ? 'draw' : 'confirmed';
          g.winnerSource = 'manual';
        }
      } else {
        msg.innerHTML = `<div class="err">${esc(data.error)}</div>`;
      }
    });
    card.querySelector('.delete-btn').addEventListener('click', async () => {
      if (!confirm('Delete this game submission? This cannot be undone.')) return;
      const res = await fetch(`/api/admin/games/${id}`, {
        method: 'DELETE',
        headers: { 'X-Admin-Password': getPw() }
      });
      if (res.ok) {
        card.remove();
        allGames = allGames.filter(x => x.id !== id);
      } else {
        const data = await res.json();
        card.querySelector('.save-msg').innerHTML = `<div class="err">${esc(data.error)}</div>`;
      }
    });
  });
}
</script>
</body>
</html>
